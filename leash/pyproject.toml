[project]
name = "leash"
version = "0.1.0"
description = "Leash — issuer-side policy engine that decides whether an AI shopping agent may spend a customer's money (Viseca / START Hack 2026)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "openai>=1.50",
  "mcp>=1.2",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
